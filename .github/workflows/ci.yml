name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; nothing here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # Synthetic values only — never a real project's secrets. The build does
      # not contact Supabase; these exist so configuration parsing succeeds.
      - name: Build
        run: npm run build
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key-not-real-value
          PROFILE_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          SHARE_CODE_HMAC_KEY: ci-share-code-hmac-key-not-a-real-secret
          OWNER_TOKEN_HMAC_KEY: ci-owner-token-hmac-key-not-a-real-secret
          RATE_LIMIT_HMAC_KEY: ci-rate-limit-hmac-key-not-a-real-secret
          CRON_SECRET: ci-cron-secret-value-not-a-real-secret

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Runs against the in-memory PostgREST stub, so no database is involved.
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
